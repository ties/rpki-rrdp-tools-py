# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
name: Python

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: install (dev) dependencies
        run: uv sync --locked --all-extras --dev

      - name: lint (ruff)
        run: |
          # stop the build if there are Python syntax errors or undefined names
          uv run ruff --output-format=github --select=E9,F63,F7,F82 --target-version=py312 .
          # default set of ruff rules with GitHub Annotations
          uv run ruff --output-format=github --target-version=py312 .
      - name: lint (black)
        run: |
          uv run black --check --diff rrdp_tools tests
      - name: test
        run: uv run pytest --cov rrdp_tools --cov-report html -qq -o console_output_style=count -p no:sugar tests
      - name: package and test packaging
        run: |
          uv build
          uv run twine check dist/*
          uv run check-manifest
      - name: Save artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dist
          path: |
            dist
