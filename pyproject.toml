[project]
name = "rrdp-tools"
version = "0.4.0"
description = ""
authors = [{name="Ties de Kock", email="ties@tiesdekock.nl"}]
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "rnc2rng>=2.6.6",
    "lxml>=6.0.2",
    "aiohttp>=3.13.0",
    "click>=8.1.3",
    "asn1crypto>=1.5.1",
    "asn1tools>=0.166.0",
    "diskcache>=5.6.3",
    "alive-progress>=3.1.5",
    "multidict>=6.0.5",
]

[project.scripts]
rrdp-tools = "rrdp_tools.cli:cli"


[dependency-groups]
dev = [
  "ipdb>=0.13.9",
  "pre-commit>=2.20.0",
  "black>=22.10.0",
  "jupyterlab>=4.0.0",
  "pandas>=2.0.1",
  "tabulate>=0.9.0",
  "pytest>=7.4.2",
  "flake8>=6.1.0",
  "pytest-asyncio>=0.21.1",
  "twine>=4.0.2",
  "check-manifest>=0.49",
  "pytest-cov>=4.1.0",
  "pytest-xdist>=3.3.1",
  "ruff>=0.14"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88
profile = "black"

[tool.ruff]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
ignore = ["E501"]

[tool.pytest]
junit_family = "xunit2"

[settings]
# known_third_party = []
